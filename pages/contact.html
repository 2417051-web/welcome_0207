<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Write a Tribute | Welcome Fouji</title>

    <link rel="stylesheet" href="../css/style.css">

    <link rel="stylesheet" href="../css/responsive.css">

</head>

<body>


<header class="navbar">

    <div class="logo">

        🇮🇳 WELCOME FOUJI

    </div>


    <nav class="nav-links">

        <a href="../index.html">Home</a>

        <a href="heroes.html">Our Heroes</a>

        <a href="gallery.html">Gallery</a>

        <a href="contact.html">Contact</a>

    </nav>

</header>


<section class="contact-section">


    <div class="contact-container">


        <div class="contact-info">


            <p class="hero-label">

                🇮🇳 YOUR WORDS MATTER

            </p>


            <h1>

                WRITE A

                <span>TRIBUTE</span>

            </h1>


            <p>

                Write a message of gratitude for the brave soldiers

                who protect our nation.

            </p>


        </div>


        <form id="tributeForm">


            <input

                type="text"

                placeholder="Your Name"

                required

            >


            <input

                type="email"

                placeholder="Your Email"

                required

            >


            <textarea

                placeholder="Write your tribute message..."

                rows="7"

                required

            ></textarea>


            <button

                type="submit"

                class="primary-btn"

            >

                SEND TRIBUTE 🇮🇳

            </button>


        </form>


    </div>

</section>


<script>


const tributeForm = document.getElementById("tributeForm");


tributeForm.addEventListener("submit", function(event) {


    event.preventDefault();


    alert(

        "🇮🇳 Thank you for your heartfelt tribute. Jai Hind!"

    );


    tributeForm.reset();


});


</script>


</body>

</html>
